name: Daily Instagram Posting Agent

on:
  schedule:
    # Runs every morning at 01:30 UTC (07:00 AM IST)
    - cron: '30 1 * * *'
  workflow_dispatch:
    # Allows manual 1-click test run from GitHub Actions tab

permissions:
  contents: write

jobs:
  post-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Instagram Posting Agent
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          node instagram-agent/post_daily.js

      - name: Commit post status updates
        run: |
          git config --local user.email "bot@divyamangalam.com"
          git config --local user.name "DivyaMangalam Agent"
          git add DAILY_POSTS.md instagram-agent/post_log.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(instagram): record daily post status [skip ci]" && git push)

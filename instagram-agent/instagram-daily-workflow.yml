name: Divya Mangalam Instagram 5-Slot Peak Automation

on:
  schedule:
    # Slot 1: 07:00 AM IST (01:30 UTC) - Morning Deity & Daily Panchang
    - cron: '30 1 * * *'
    # Slot 2: 12:00 PM IST (06:30 UTC) - Midday Rashi & Benefitted Signs Forecast
    - cron: '30 6 * * *'
    # Slot 3: 03:30 PM IST (10:00 UTC) - Shubh Muhurat & Timings Guide
    - cron: '0 10 * * *'
    # Slot 4: 07:30 PM IST (14:00 UTC) - Evening Devotional Reel / Darshan
    - cron: '0 14 * * *'
    # Slot 5: 09:30 PM IST (16:00 UTC) - Night Spiritual Reflection & Palm Reading Spotlight
    - cron: '0 16 * * *'

  workflow_dispatch:
    inputs:
      post_type:
        description: 'Choose which post to publish'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - deity
          - rashi
          - muhurat
          - palm

permissions:
  contents: write

jobs:
  publish-instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine Post Type
        id: determine-type
        run: |
          INPUT_TYPE="${{ inputs.post_type }}"
          if [ -z "$INPUT_TYPE" ] || [ "$INPUT_TYPE" = "auto" ]; then
            HOUR=$(date -u +"%H")
            if [ "$HOUR" -ge 1 ] && [ "$HOUR" -lt 5 ]; then
              POST_TYPE="deity"
            elif [ "$HOUR" -ge 5 ] && [ "$HOUR" -lt 9 ]; then
              POST_TYPE="rashi"
            elif [ "$HOUR" -ge 9 ] && [ "$HOUR" -lt 12 ]; then
              POST_TYPE="muhurat"
            elif [ "$HOUR" -ge 12 ] && [ "$HOUR" -lt 15 ]; then
              POST_TYPE="deity"
            else
              POST_TYPE="palm"
            fi
          else
            POST_TYPE="$INPUT_TYPE"
          fi
          echo "Selected post type: $POST_TYPE"
          echo "post_type=$POST_TYPE" >> $GITHUB_OUTPUT

      - name: Run Instagram Posting Agent
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          POST_TYPE: ${{ steps.determine-type.outputs.post_type }}
        run: |
          node instagram-agent/post_daily.js --type=$POST_TYPE

      - name: Commit post status updates
        run: |
          git config --local user.email "bot@divyamangalam.com"
          git config --local user.name "DivyaMangalam Agent"
          git add DAILY_POSTS.md instagram-agent/post_log.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(instagram): record daily post status [skip ci]" && git push)
